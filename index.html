<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Hexagon Multivista</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

  <div id="app" class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">MV</span>
        <span class="brand-name">Hexagon Multivista</span>
        <span class="brand-sub">Project Dashboard</span>
      </div>
      <nav class="mainnav">
        <a href="index.html" class="nav-link active">Dashboard</a>
        <a href="issues.html" class="nav-link">Issues</a>
      </nav>
      <div class="sync-status" id="sync-status">
        <span class="pulse" id="pulse"></span>
        <span id="sync-text">Loading sync status&hellip;</span>
      </div>
    </header>

    <main class="content">

      <section class="kpi-section">
        <div class="kpi-grid" id="kpi-grid">
          <!-- KPI cards injected by dashboard.js -->
        </div>
      </section>

      <section class="charts-section">
        <div class="chart-panel chart-panel-wide">
          <div class="panel-head">
            <h2>Issues by Territory</h2>
          </div>
          <div class="chart-wrap chart-wrap-tall">
            <canvas id="territory-chart"></canvas>
          </div>
        </div>
        <div class="chart-panel">
          <div class="panel-head">
            <h2>Status Breakdown</h2>
          </div>
          <div class="chart-wrap chart-wrap-tall">
            <canvas id="status-chart"></canvas>
          </div>
        </div>
      </section>

      <section class="breakdown-section">
        <div class="panel-head">
          <h2>Territory Detail</h2>
        </div>
        <div id="territory-breakdown" class="territory-list">
          <!-- rows injected by dashboard.js -->
        </div>
      </section>

    </main>

    <footer class="footer">
      Data syncs automatically from Jira. This dashboard does not allow editing Jira data.
    </footer>

  </div>

  <script src="shared.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
